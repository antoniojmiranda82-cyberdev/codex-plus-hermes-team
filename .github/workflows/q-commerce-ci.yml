name: Q Commerce Command CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/commerce/**'
      - 'tests/commerce-*.test.ts'
      - 'dashboard/**'
      - 'examples/q-commerce-team.example.yaml'
      - '.github/workflows/q-commerce-ci.yml'
  push:
    branches: [q-commerce-command]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
